spring.application.name=Treinos

# Configuracao do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/dbtreino?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Criacao de Tabelas
spring.jpa.hibernate.ddl-auto=update

# Secret do JWT
# Em producao defina a variavel de ambiente JWT_SECRET (o valor abaixo e so para desenvolvimento)
api.security.token.secret=${JWT_SECRET:segredo-apenas-para-desenvolvimento-local}

# Logs de Debug do Spring Security e Hibernate
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE